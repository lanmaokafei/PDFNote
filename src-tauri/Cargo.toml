[package]
name = "pdfnote"
version = "0.34.0"
description = "A local-first, card-centric PDF learning app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdfnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# 可选视觉模型通道（本机 Ollama / 自填云端 Key）。默认不配置即不发任何请求。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 网关超时后轮询异步任务结果时需要异步 sleep。
tokio = { version = "1", features = ["time"] }

# Apple Vision is macOS-only; keep the native FFI dependency off other targets.
[target.'cfg(target_os = "macos")'.dependencies]
rightkit-ocr = { version = "0.2.3", default-features = false, features = ["native"] }
